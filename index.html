<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOXX conversation check</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <p class="eyebrow">BOXX</p>
        <h1 id="headline">Loading</h1>
      </div>
    </div>
    <a class="source" href="https://github.com/Shunyalabsai/box-automation-suit">Source</a>
  </header>

  <section class="score" id="score"></section>

  <div class="tools">
    <nav class="filters" id="filters">
      <button type="button" data-filter="failed">Failed</button>
      <button type="button" data-filter="broke">Newly broken</button>
      <button type="button" data-filter="fixed">Fixed</button>
      <button type="button" data-filter="all">All</button>
    </nav>
    <input id="search" type="search" placeholder="Search" aria-label="Search conversations">
  </div>

  <main id="list"></main>
  <script src="app.js"></script>
</body>
</html>
