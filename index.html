<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOXX conversation check</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">BOXX conversation check</p>
      <h1 id="headline">Loading the latest check.</h1>
      <p class="sub" id="meta"></p>
    </div>
    <a class="source" href="https://github.com/Shunyalabsai/box-automation-suit">Source</a>
  </header>

  <section class="verdict" id="verdict" hidden></section>
  <section class="stats" id="stats"></section>
  <section class="history" id="history"></section>

  <div class="tools">
    <nav class="filters" id="filters">
      <button type="button" data-filter="failed">Failed</button>
      <button type="button" data-filter="broke">Was working, now failed</button>
      <button type="button" data-filter="fixed">Fixed</button>
      <button type="button" data-filter="all">All conversations</button>
    </nav>
    <input id="search" type="search" placeholder="Search a message or a case" aria-label="Search conversations">
  </div>
  <p class="hint" id="hint"></p>

  <main id="list"></main>
  <script src="app.js"></script>
</body>
</html>
