<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOXX automation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">BOXX conversation tests</p>
      <h1>What is still broken</h1>
      <p class="sub" id="meta">Loading the latest published run.</p>
    </div>
    <a class="source" href="https://github.com/Shunyalabsai/box-automation-suit">Source</a>
  </header>

  <section class="stats" id="stats"></section>
  <section class="history" id="history"></section>

  <nav class="filters" id="filters">
    <button type="button" data-filter="broke" class="on">Broke since last run</button>
    <button type="button" data-filter="still">Still failing</button>
    <button type="button" data-filter="fixed">Fixed</button>
    <button type="button" data-filter="all">Every case</button>
  </nav>

  <main id="list"></main>
  <script src="app.js"></script>
</body>
</html>
